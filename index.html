<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ANGULAR__JS__SUPABASE</title>
    <link rel="shortcut icon" href="favicon.png" type="image/png" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- ANGULAR JS-->
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.3/angular.min.js"></script>
    <!-- SUPABASE SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- APPLICATION -->
    <script src="./js/app.module.js"></script>
    <script src="./js/config/supabase.js"></script>
    <script src="./js/services/supabase.service.js"></script>
    <script src="./js/controllers/home.controller.js"></script>
  </head>
  <body class="bg-zinc-900" ng-app="app" ng-controller="HomeController">
    <div class="flex items-center justify-center h-screen container mx-auto">
      <h1 class="text-2xl font-bold text-white">
        <form novalidate class="flex flex-col justify-center items-center bg-zinc-800 p-6 rounded-lg shadow-md">
          <input type="text" class="rounded-lg px-2 py-1 text-white border-4 border-white/20 mb-4" ng-model="vm.username" />
          <button
            ng-disabled="vm.waiting || !vm.username"
            ng-click="insertUser()"
            class="bg-emerald-500 disabled:opacity-50 cursor-pointer active:bg-emerald-600 w-full text-white px-4 py-2 rounded"
          >
            Submit
          </button>
        </form>
      </h1>
    </div>
  </body>
</html>
