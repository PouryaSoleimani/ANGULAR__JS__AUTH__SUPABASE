<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ANGULAR__JS__SUPABASE</title>
    <link rel="shortcut icon" href="favicon.png" type="image/png" />
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css" />
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/fill/style.css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- ANGULAR JS-->
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.3/angular.min.js"></script>
    <!-- SUPABASE SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- APPLICATION -->
    <script src="./js/app.module.js"></script>
    <script src="./js/config/supabase.js"></script>
    <script src="./js/services/supabase.service.js"></script>
    <script src="./js/controllers/home.controller.js"></script>
  </head>
  <body class="bg-zinc-900" ng-app="app" ng-controller="HomeController">
    <!--* CONTAINER -->
    <div class="grid grid-rows-4 py-24 h-screen container mx-auto">
      <!--& TOP -->
      <div id="TOP" class="border-b-2 border-dashed row-span-1 border-white/30 w-full pb-12">
        <form novalidate class="flex w-1/2 justify-self-center flex-col justify-center items-center bg-zinc-800 p-6 rounded-lg shadow-md">
          <input
            type="text"
            id="name_input"
            class="name_input leading-0 focus:outline-none w-full rounded-lg px-2 py-2 text-white border-4 border-white/20 mb-4"
            ng-model="vm.username"
          />
          <button
            ng-disabled="vm.waiting || !vm.username"
            ng-click="insertUser()"
            class="bg-emerald-500 disabled:opacity-50 cursor-pointer active:bg-emerald-600 w-full text-white px-4 py-2 rounded"
          >
            Submit
          </button>
        </form>
      </div>
      <!--& BOTTOM -->
      <div id="BOTTOM" class="grid grid-cols-3 row-span-3 gap-3 h-fit p-10 border-white/30 w-full">
          <!--^  NO USERS -->
        <div 
        class="grid items-center font-semibold justify-center text-white w-full col-span-6" 
        ng-if="!vm.waiting && !vm.users.length"
        >
          <p>No users found</p>
        </div>

        <!--^ LOADING -->
        <div ng-if="vm.waiting" class="grid items-center justify-center font-semibold text-white w-full col-span-6">
         <i class="ph ph-spinner animate-spin text-4xl text-yellow-400"></i>
        </div>
        
        <!--^ GRID -->
        <div
          ng-if="vm.users.length"
          class="card p-3 h-fit border-2 border-zinc-700 bg-zinc-800 text-zinc-200 rounded-lg"
          ng-show="!vm.waiting && vm.users.length"
          ng-repeat="item in vm.users"
        >
          <p class="grid grid-cols-2 mb-1 justify-between">Fullname <span class="justify-self-end">{{ item.full_name | uppercase }}</span></pحح>
          <p class="grid grid-cols-2 mb-1 justify-between">Email <span class="justify-self-end">{{ item.email }}</span></p>
          <p class="grid grid-cols-2 justify-between">Age <span class="justify-self-end">{{ item.age }}</span></p>
        </div>
      </div>
    </div>
  </body>
</html>
