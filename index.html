<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ANGULAR__JS__SUPABASE</title>
  <link rel="shortcut icon" href="favicon.png" type="image/png" />
  <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css" />
  <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/fill/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="./css/style.css">
  <!-- ANGULAR JS-->
  <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.3/angular.min.js"></script>
  <!-- SUPABASE SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- APPLICATION -->
  <script src="./js/app.module.js"></script>
  <script src="./js/config/supabase.js"></script>
  <script src="./js/services/supabase.service.js"></script>
  <script src="./js/controllers/home.controller.js"></script>
</head>

<body class="bg-zinc-900 overflow-x-hidden" ng-app="app" ng-controller="HomeController">
  <div class="toast bg-white w-64 h-16 p-4 leading-5 text-xl rounded-lg font-semibold absolute top-6 right-4 border-4 outside">TOAST</div>
  <!--^ CONTAINER -->
  <div class="grid grid-rows-4 pt-24 min-h-screen container mx-auto">
    <!--& TOP -->
    <div class="border-b-2 border-dashed row-span-1 border-white/30 w-full pb-12" id="TOP">
      <form class="flex outline-6 outline-zinc-300/30 bg-black w-1/3 h-44 justify-self-center grid p-6 rounded-lg shadow-md" novalidate>
        <input class="name_input JetBrains_Mono bg-zinc-800 text-xl font-semibold leading-0 focus:outline-none w-full rounded-lg px-2 py-2 text-white border-4 border-white/20 mb-4" type="text" id="name_input" ng-model="vm.username" />
        <button class="bg-sky-500 disabled:opacity-50 JetBrains_Mono font-bold text-lg cursor-pointer active:bg-emerald-600 w-full text-white px-4 py-2 rounded" ng-disabled="vm.waiting || !vm.username" ng-click="insertUser()">
          SIGN UP
        </button>
      </form>
    </div>
    <!--& BOTTOM -->
    <div class="grid grid-cols-3 row-span-3 gap-y-5 gap-x-3 h-fit p-10 border-white/30 w-full" id="BOTTOM">
      <!--^  NO USERS -->
      <div class="flex flex-col p-4 w-fit gap-4 items-center font-semibold justify-center text-white w-full col-span-3" ng-if="!vm.waiting && !vm.users.length">
        <div class="bg-zinc-800 flex flex-col justify-center items-center gap-2 p-4 rounded-lg">
          <i class="ph-fill ph-warning grid text-yellow-500 text-4xl"></i>
          <p class="text-2xl">No users found</p>
        </div>
      </div>

      <!--^ LOADING -->
      <div class="grid min-h-64 items-center justify-center font-semibold text-white w-full col-span-6" ng-if="vm.waiting">
        <i class="ph ph-spinner animate-spin animate text-6xl text-cyan-400"></i>
      </div>

      <!--^ GRID -->
      <div ng-if="vm.users.length && !vm.waiting && vm.users.length" class="card py-3 px-4 h-fit border-2 relative border-zinc-700 bg-zinc-800 text-zinc-200 rounded-lg" ng-class="{'!border-emerald-800 !bg-emerald-900/10' : item.isAccepted}"
        ng-repeat="item in vm.users">
        <span class="absolute -top-4 left-2 bg-white text-black border-2 border-black rounded-lg px-1.5 py-px leading-6 font-bold">#{{item.id}}</span>
        <p class="grid grid-cols-2 pb-2 border-b border-white/10 leading-8 justify-between">
          Fullname <span class="justify-self-end max-w-[190px] whitespace-nowrap overflow-hidden text-ellipsis">{{ item.full_name | uppercase }}</span>
        </p>
        <p class="grid grid-cols-2 pb-2 border-b leading-10 border-white/10 justify-between">
          Email <span class="justify-self-end">{{ item.email }}</span>
        </p>
        <p class="grid grid-cols-2 justify-between py-2 border-b border-white/10 leading-8">
          Age <span class="justify-self-end">{{ item.age }}</span>
        </p>
        <div class="flex items-center justify-between">
          <div class="flex gap-1.5">
            <button class="bg-emerald-800 mt-4 text-sm font-bold hover:bg-emerald-700 cursor-pointer text-white py-2 px-4 rounded" ng-click="acceptUser(item.id)">
              ACCEPT
            </button>
            <button class="bg-zinc-700 mt-4 text-sm font-bold hover:bg-zinc-600 cursor-pointer text-white py-2 px-4 rounded" ng-click="denyUser(item.id)">
              DENY
            </button>
          </div>
          <button class="bg-red-900 rounded-full mt-4 text-sm font-bold hover:bg-red-800 cursor-pointer text-white py-3 px-3 grid rounded" ng-click="deleteUser(item.id)">
            <i class="ph-fill ph-trash text-xl"></i>
          </button>
        </div>
      </div>
    </div>
  </div>
</body>

</html>
